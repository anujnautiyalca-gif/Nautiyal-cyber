<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="108" fill="url(#cyberBg)"/>
  
  <!-- Subtle cyber circuit network rings -->
  <circle cx="256" cy="256" r="180" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" stroke="#0ea5e9" stroke-width="2.5" fill="none" opacity="0.3"/>

  <!-- Glowing Hex Shield / Tech badge -->
  <polygon points="256,90 390,165 390,320 256,400 122,320 122,165" 
           fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Computer screen / Cyber portal symbol -->
  <rect x="180" y="170" width="152" height="105" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="256" cy="222" r="28" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M256 204 L256 240 M238 222 L274 222" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Monitor base -->
  <path d="M236 275 L276 275 M256 275 L256 295 M220 295 L292 295" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- Text / Monogram NC -->
  <text x="256" y="360" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">NAUTIYAL</text>
  <text x="256" y="388" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="6">CYBER CAFE</text>
</svg>
